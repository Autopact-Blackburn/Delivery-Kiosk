.chart-track{height:22px;background:#eef0f4;border-radius:999px;overflow:hidden;display:flex}

.chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:11px;font-weight:800}

}


.weather-mini{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:118px}

@media(max-width:700px){
  .weather-mini{min-width:auto}
  .weather-mini .weather-main{font-size:16px}
}

</style>

<script>

function esc(v){
  return String(v==null?"":v).replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m];
  });
}
function pinPassword(pin){return PIN_PREFIX+pin;}
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add("show");
  setTimeout(function(){toastEl.classList.remove("show");},2200);
}
function roleLabel(role){
  return {admin:"Admin",manager:"Manager",sales:"Sales Consultant",service:"Service Team"}[role]||role||"";
}
function isManagement(){return profile && (profile.role==="admin"||profile.role==="manager");}
function melbourneDateKey(value){
  const d=value?new Date(value):new Date();
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Melbourne",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d);
  const o={};parts.forEach(function(p){o[p.type]=p.value;});
  return o.year+"-"+o.month+"-"+o.day;
}
function isToday(value){return !!value && melbourneDateKey(value)===melbourneDateKey();}
function fmtDateTime(value){
  if(!value)return"Not scheduled";
  return new Intl.DateTimeFormat("en-AU",{timeZone:"Australia/Melbourne",day:"2-digit",month:"short",hour:"numeric",minute:"2-digit"}).format(new Date(value));
}
function fmtTime(value){
  if(!value)return"";
  return new Intl.DateTimeFormat("en-AU",{timeZone:"Australia/Melbourne",hour:"numeric",minute:"2-digit"}).format(new Date(value));
}
function brandBucket(d){
  const brand=String(d.brand||"").toUpperCase();
  const dep=String(d.department||"").toUpperCase();
  if(dep.indexOf("USED")>-1||brand==="USED")return"USED";
  if(brand.indexOf("KIA")>-1)return"KIA";
  if(brand.indexOf("GWM")>-1||brand.indexOf("HAVAL")>-1)return"GWM";
  if(brand.indexOf("NISSAN")>-1)return"NISSAN";
  return brand||"OTHER";
}
function statusText(s){return String(s||"scheduled").replace(/_/g," ");}
function normalisedDealNumber(d){return String((d&&d.deal_number)||"").trim().toUpperCase();}
function completedDealNumbers(){
  const set=new Set();
  deliveries.forEach(function(d){if(d.status==="completed"&&normalisedDealNumber(d))set.add(normalisedDealNumber(d));});
  return set;
}
function isSuppressedCompletedDuplicate(d){
  const deal=normalisedDealNumber(d);
  return !!deal&&d.status!=="completed"&&completedDealNumbers().has(deal);
}
function operationalDate(d){return d.scheduled_delivery_at||d.estimated_delivery_at||null;}
function stableDeliverySort(a,b){
  const ad=operationalDate(a),bd=operationalDate(b);
  if(ad&&bd){const diff=new Date(ad)-new Date(bd);if(diff!==0)return diff;}
  if(ad&&!bd)return-1;if(!ad&&bd)return 1;
  return normalisedDealNumber(a).localeCompare(normalisedDealNumber(b));
}
function displayStatus(d){
  if(d.status==="completed")return{key:"completed",label:"Completed"};
  if(isOverdueDelivery(d))return{key:"overdue",label:"Overdue"};
  if(d.status==="waiting_service")return{key:"waiting_service",label:"Waiting Service"};
  if(d.status==="in_progress")return{key:"in_progress",label:"In Progress"};
  if(d.scheduled_delivery_at)return{key:"booked",label:"Booked"};
  return{key:"needs_action",label:"Needs Action"};
}
function isOutstanding(d){return d.status!=="completed"&&d.status!=="cancelled"&&!isSuppressedCompletedDuplicate(d);}
function isPast(value){return !!value && new Date(value).getTime()<Date.now() && !isToday(value);}
function expectedDate(d){return d.estimated_delivery_at||d.scheduled_delivery_at||null;}
function isBooked(d){return !!d.scheduled_delivery_at;}
function currentMonthKey(){return melbourneDateKey().slice(0,7);}
function deliveryIdentity(d){
  const deal=normalisedDealNumber(d);
  if(deal)return"DEAL:"+deal;
  const customer=((d.customer_first_name||"")+" "+(d.customer_last_name||"")).trim().toUpperCase().replace(/\s+/g," ");
  const stock=String(d.stock_number||"").trim().toUpperCase();
  if(customer&&stock)return"FALLBACK:"+customer+"|"+stock;
  return"ROW:"+String(d.id||d.source_external_id||"");
}
function dedupeDeliveryRows(rows){
  const byKey=new Map();
  rows.forEach(function(d){
    const key=deliveryIdentity(d);
    const prev=byKey.get(key);
    if(!prev){byKey.set(key,d);return;}
    const score=function(x){
      return (x.status==="in_progress"||x.status==="waiting_service"?40:0)
        +(x.scheduled_delivery_at?20:0)
        +(x.estimated_delivery_at?10:0)
        +(x.rego?4:0)
        +(x.stock_number?2:0)
        +(x.deal_number?1:0);
    };
    const a=score(prev),b=score(d);
    if(b>a){byKey.set(key,d);return;}
    if(b===a){
      const pt=new Date(prev.updated_at||prev.created_at||0).getTime()||0;
      const dt=new Date(d.updated_at||d.created_at||0).getTime()||0;
      if(dt>pt)byKey.set(key,d);
    }
  });
  return Array.from(byKey.values());
}
function inCurrentMonth(d){
  return [d.estimated_delivery_at,d.scheduled_delivery_at].filter(Boolean).some(function(v){return monthKey(v)===currentMonthKey();});
}
function isOverdueDelivery(d){return isOutstanding(d)&&!!operationalDate(d)&&isPast(operationalDate(d));}
function remainingRows(){
  return dedupeDeliveryRows(deliveries.filter(function(d){return isOutstanding(d)&&inCurrentMonth(d);})).sort(stableDeliverySort);
}
function overdueRows(){
  return dedupeDeliveryRows(deliveries.filter(isOverdueDelivery)).sort(stableDeliverySort);
}
function outstandingRows(){return remainingRows();}
function needsAttention(d){return isOutstanding(d)&&(isOverdueDelivery(d)||!d.scheduled_delivery_at||d.status==="waiting_service");}
function nextActionText(d){
  const est=d.estimated_delivery_at?"Est. "+fmtDateTime(d.estimated_delivery_at):"";
  if(d.status==="waiting_service")return (est?est+" · ":"")+"Waiting for Service";
  if(!d.scheduled_delivery_at){
    if(isOverdueDelivery(d))return (est?est+" · ":"")+"OVERDUE · Not yet booked";
    return est?est+" · Not yet booked":"Not yet booked";
  }
  if(isToday(d.scheduled_delivery_at))return (est?est+" · ":"")+"Booked today · "+fmtTime(d.scheduled_delivery_at);
  if(isPast(d.scheduled_delivery_at))return (est?est+" · ":"")+"OVERDUE · "+fmtDateTime(d.scheduled_delivery_at);
  return (est?est+" · ":"")+"Booked · "+fmtDateTime(d.scheduled_delivery_at);
}
function updatedLabel(){return lastUpdatedAt?"Updated just now":"Live sync active";}
function weatherEmoji(code,wind){
  const c=Number(code);
  if(Number(wind)>=35)return"🌬️";
  if(c===0)return"☀️";
  if([1,2].includes(c))return"⛅";
  if(c===3)return"☁️";
  if([45,48].includes(c))return"🌫️";
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(c))return"🌧️";
  if([71,73,75,77,85,86].includes(c))return"❄️";
  if([95,96,99].includes(c))return"⛈️";
  return"🌤️";
}
function weatherCondition(code,wind){
  const c=Number(code);
  if(Number(wind)>=35)return"Windy";
  if(c===0)return"Clear";
  if(c===1)return"Mostly clear";
  if(c===2)return"Partly cloudy";
  if(c===3)return"Cloudy";
  if([45,48].includes(c))return"Fog";
  if([51,53,55,56,57].includes(c))return"Drizzle";
  if([61,63,65,66,67,80,81,82].includes(c))return"Rain";
  if([71,73,75,77,85,86].includes(c))return"Snow";
  if([95,96,99].includes(c))return"Storm";
  return"Current weather";
}
async function loadWeather(){
  const el=document.getElementById("weatherMini");
  if(!el)return;
  try{
    const res=await fetch("https://api.open-meteo.com/v1/forecast?latitude=-37.8398&longitude=145.1555&current=temperature_2m,weather_code,wind_speed_10m&forecast_days=1&timezone=Australia%2FMelbourne",{cache:"no-store"});
    if(!res.ok)throw new Error("Weather unavailable");
    const data=await res.json();
    const cur=data&&data.current?data.current:null;
    if(!cur)return;
    const temp=Math.round(Number(cur.temperature_2m));
    const wind=Number(cur.wind_speed_10m||0);
    el.innerHTML='<div class="weather-place">Melbourne</div><div class="weather-main">'+temp+'°C '+weatherEmoji(cur.weather_code,wind)+'</div><div class="weather-cond">'+weatherCondition(cur.weather_code,wind)+'</div>';
  }catch(err){
    console.warn("Weather widget:",err);
  }
}
function monthKey(value){
  return value?melbourneDateKey(value).slice(0,7):"";
}
function monthLabel(key){
  if(!key)return"";
  const parts=key.split("-").map(Number);
  return new Intl.DateTimeFormat("en-AU",{month:"long",year:"numeric",timeZone:"Australia/Melbourne"}).format(new Date(Date.UTC(parts[0],parts[1]-1,15)));
}
function lastMonthKeys(endKey,count){
  const parts=endKey.split("-").map(Number);
  const out=[];
  for(let i=count-1;i>=0;i--){
    const d=new Date(Date.UTC(parts[0],parts[1]-1-i,15));
    out.push(d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0"));
  }
  return out;
}
function serviceOutcomeFor(row,pushByDelivery){
  const did=row.delivery_id||row.id;
  if(did && pushByDelivery.has(did))return"push";
  if(row.first_inspection_booked)return"booked";
  if(row.service_advisor)return"intro_follow";
  return null;
}
function minutesBetween(start,end){
  if(!start||!end)return null;
  const ms=new Date(end).getTime()-new Date(start).getTime();
  return Number.isFinite(ms)&&ms>=0?Math.round(ms/60000):null;
}
function durationText(minutes){
  if(minutes==null)return"—";
  if(minutes<60)return minutes+" min";
  const h=Math.floor(minutes/60),m=minutes%60;
  return h+"h"+(m?" "+m+"m":"");
}

async function init(){
  if(!window.supabase || !window.supabase.createClient){
    fatal("Supabase library did not load. Check internet access and refresh.");
    return;
  }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}
  });

  const params=new URLSearchParams(window.location.search);
  const serviceToken=params.get("service");

  const sessionResult=await sb.auth.getSession();
  const session=sessionResult.data && sessionResult.data.session ? sessionResult.data.session : null;

  if(!session){
    renderLogin(serviceToken);
    return;
  }

  const trustedAt=parseInt(localStorage.getItem(TRUST_KEY)||"0",10);
  if(trustedAt && (Date.now()-trustedAt)>THIRTY_DAYS){
    await sb.auth.signOut();
    localStorage.removeItem(TRUST_KEY);
    renderLogin(serviceToken);
    return;
  }

  currentUser=session.user;
  await loadProfile();

  if(profile && profile.must_change_pin){
    renderChangePin(serviceToken);
    return;
  }

  if(serviceToken){
    await renderServiceRoute(serviceToken);
    return;
  }

  await syncFromTim("");
  await loadDeliveries();
  renderShell();
  startRealtime();
}

async function syncFromTim(q,scope){
  try{
    const body={};if(q)body.q=q;if(scope)body.scope=scope;
    const opts={body:body};
    const res=await sb.functions.invoke("delivery-sync",opts);
    if(res.error){
      console.error("Delivery sync failed:",res.error);
      toast("Live delivery feed unavailable");
      return false;
    }
    if(res.data && res.data.unresolved_salespeople && res.data.unresolved_salespeople.length){
      console.warn("Unmatched salesperson names:",res.data.unresolved_salespeople);
    }
    lastUpdatedAt=Date.now();
    return true;
  }catch(err){
    console.error("Delivery sync exception:",err);
    toast("Live delivery feed unavailable");
    return false;
  }
}

async function openDelivery(id,returnView){
  document.body.classList.remove("reports-wide");
  deliveryReturnView=returnView||currentView||"home";
  currentView="delivery";
  activeDelivery=deliveries.find(function(d){return d.id===id;});
  if(!activeDelivery)return;

  let sessionRes=await sb.from("delivery_sessions").select("*").eq("delivery_id",id).maybeSingle();
  if(sessionRes.error){toast(sessionRes.error.message);return;}
  let sess=sessionRes.data;

  if(!sess && activeDelivery.status!=="completed"){
    const start=await sb.rpc("start_delivery",{p_delivery_id:id});
    if(start.error){toast(start.error.message);return;}
    const newSession=await sb.from("delivery_sessions").select("*").eq("id",start.data).single();
    if(newSession.error){toast(newSession.error.message);return;}
    sess=newSession.data;
  }

  activeSession=sess;
  await refreshActive(false);
  renderDelivery();
}

async function refreshActive(doRender){
  if(!activeDelivery)return;
  const dRes=await sb.from("deliveries").select("*").eq("id",activeDelivery.id).single();
  if(!dRes.error)activeDelivery=dRes.data;

  const sRes=await sb.from("delivery_sessions").select("*").eq("delivery_id",activeDelivery.id).maybeSingle();
  if(!sRes.error)activeSession=sRes.data;

  if(activeSession){
    const stRes=await sb.from("delivery_steps").select("*").eq("session_id",activeSession.id).order("step_number");
    steps=stRes.data||[];
    const hRes=await sb.from("service_handoffs").select("*").eq("session_id",activeSession.id).order("created_at",{ascending:false}).limit(1);
    handoff=(hRes.data&&hRes.data.length)?hRes.data[0]:null;
  }else{
    steps=[];handoff=null;
  }
  if(doRender!==false)renderDelivery();
}

async function undoStep(n){
  if(![1,2,4].includes(n))return;

async function renderReports(ownOnly){
  const main=document.getElementById("main");
  if(!main)return;
  document.body.classList.add("reports-wide");
  currentView="reports";
  reportOwnOnly=!!ownOnly;

  let dq=sb.from("deliveries").select("*").order("estimated_delivery_at",{ascending:false,nullsFirst:false}).limit(3000);
  if(ownOnly)dq=dq.eq("assigned_salesperson_id",currentUser.id);
  const dres=await dq;
  if(dres.error){toast(dres.error.message);return;}
  const allDeliveries=dres.data||[];

  let rq=sb.from("delivery_report").select("*").order("scheduled_delivery_at",{ascending:false}).limit(3000);
  if(ownOnly)rq=rq.eq("assigned_salesperson_id",currentUser.id);
  const rres=await rq;
  const auditRows=rres.error?[]:(rres.data||[]);

  let sq=sb.from("service_push_queue").select("*").order("pushed_at",{ascending:false}).limit(3000);
  if(ownOnly)sq=sq.eq("salesperson_id",currentUser.id);
  const sres=await sq;
  const allPushRows=sres.error?[]:(sres.data||[]);

  // Session / step / handoff detail is read directly so timestamps and
  // elapsed times stay visible without changing the existing report view.
  let sessQ=sb.from("delivery_sessions").select("*").limit(3000);
  const sessRes=await sessQ;
  let allSessions=sessRes.error?[]:(sessRes.data||[]);
  if(ownOnly){
    const allowed=new Set(allDeliveries.map(function(d){return d.id;}));
    allSessions=allSessions.filter(function(s){return allowed.has(s.delivery_id);});
  }

  let stepRows=[];
  if(allSessions.length){
    const sessionIds=allSessions.map(function(s){return s.id;});
    const stRes=await sb.from("delivery_steps").select("*").in("session_id",sessionIds).limit(10000);
    stepRows=stRes.error?[]:(stRes.data||[]);
  }

  let handoffRows=[];
  if(allSessions.length){
    const sessionIds=allSessions.map(function(s){return s.id;});
    const hRes=await sb.from("service_handoffs").select("*").in("session_id",sessionIds).limit(5000);
    handoffRows=hRes.error?[]:(hRes.data||[]);
  }

  const auditByDelivery=new Map();
  auditRows.forEach(function(r){
    const key=r.delivery_id||r.id||r.deal_number;
    if(key)auditByDelivery.set(String(key),r);
  });
  const pushByDelivery=new Map();
  allPushRows.forEach(function(r){if(r.delivery_id)pushByDelivery.set(r.delivery_id,r);});

  const sessionByDelivery=new Map();
  allSessions.forEach(function(s){if(s.delivery_id)sessionByDelivery.set(String(s.delivery_id),s);});

  const stepsBySession=new Map();
  stepRows.forEach(function(s){
    if(!stepsBySession.has(String(s.session_id)))stepsBySession.set(String(s.session_id),[]);
    stepsBySession.get(String(s.session_id)).push(s);
  });

  const handoffBySession=new Map();
  handoffRows.forEach(function(h){
    const key=String(h.session_id);
    const prev=handoffBySession.get(key);
    if(!prev||new Date(h.created_at||0)>new Date(prev.created_at||0))handoffBySession.set(key,h);
  });

  function auditFor(d){return auditByDelivery.get(String(d.id))||auditByDelivery.get(String(d.deal_number||""))||null;}
  function sessionFor(d){return sessionByDelivery.get(String(d.id))||null;}
  function completionAt(d){
    const s=sessionFor(d);
    const a=auditFor(d)||{};
    return (s&&(s.completed_at||s.finished_at))||a.completed_at||a.delivery_completed_at||null;
  }
  function firstStepAt(d){
    const s=sessionFor(d);
    if(!s)return null;
    const arr=stepsBySession.get(String(s.id))||[];
    const times=arr.map(function(x){return x.completed_at;}).filter(Boolean).sort();
    return times.length?times[0]:null;
  }
  function processMinutes(d){
    const a=auditFor(d)||{};
    const calculated=minutesBetween(firstStepAt(d),completionAt(d));
    if(calculated!=null)return calculated;
    return a.delivery_duration_minutes!=null?Math.round(Number(a.delivery_duration_minutes)):null;
  }
  function step3Timing(d){
    const p=pushByDelivery.get(d.id);
    if(p){
      return{
        start:p.pushed_at||null,
        end:p.actioned_at||null,
        minutes:minutesBetween(p.pushed_at,p.actioned_at)
      };
    }
    const s=sessionFor(d);
    const h=s?handoffBySession.get(String(s.id)):null;
    if(!h)return{start:null,end:null,minutes:null};
    const end=h.completed_at||h.actioned_at||h.updated_at||null;
    return{start:h.created_at||null,end:end,minutes:minutesBetween(h.created_at,end)};
  }
  function reportMonthMatch(d,k){
    return [d.estimated_delivery_at,d.scheduled_delivery_at,completionAt(d)]
      .filter(Boolean)
      .some(function(v){return monthKey(v)===k;});
  }

  const salespersonNames=Array.from(new Set(allDeliveries.map(function(r){return r.assigned_salesperson_name;}).filter(Boolean))).sort(function(a,b){return a.localeCompare(b);});
  const brands=Array.from(new Set(allDeliveries.map(function(r){return brandBucket(r);}).filter(Boolean))).sort(function(a,b){return a.localeCompare(b);});

  const scopeRows=allDeliveries.filter(function(r){
    if(!ownOnly&&reportSalesperson!=="ALL"&&r.assigned_salesperson_name!==reportSalesperson)return false;
    if(reportBrand!=="ALL"&&brandBucket(r)!==reportBrand)return false;
    return !!(r.estimated_delivery_at||r.scheduled_delivery_at||completionAt(r));
  });

  function uniqueDeals(list){
    const map=new Map();
    list.forEach(function(d){
      const key=normalisedDealNumber(d)||String(d.id);
      const prev=map.get(key);
      if(!prev){map.set(key,d);return;}
      if(d.status==="completed"&&prev.status!=="completed"){map.set(key,d);return;}
      if(!prev.scheduled_delivery_at&&d.scheduled_delivery_at){map.set(key,d);}
    });
    return Array.from(map.values());
  }
  // Monthly report population is unique Deal Numbers that were estimated, booked or completed in the month.
  const rows=uniqueDeals(scopeRows.filter(function(r){return reportMonthMatch(r,reportMonth);}));
  // Covered = unique deals with a confirmed booking in the month and/or completed in the month.
  const coveredRows=rows.filter(function(d){
    return (d.scheduled_delivery_at&&monthKey(d.scheduled_delivery_at)===reportMonth)||(completionAt(d)&&monthKey(completionAt(d))===reportMonth);
  });
  const covered=coveredRows.length;
  const booked=coveredRows.filter(function(d){return !!d.scheduled_delivery_at;}).length;
  const completed=coveredRows.filter(function(d){return d.status==="completed"||!!completionAt(d);}).length;
  const processGap=coveredRows.filter(function(d){return d.status!=="completed"&&!completionAt(d)&&operationalDate(d)&&isPast(operationalDate(d));}).length;
  const bookingPct=covered?Math.round((booked/covered)*100):0;
  const completedPct=covered?Math.round((completed/covered)*100):0;
  const total=rows.length;

  const outcomeCounts={booked:0,intro_follow:0,push:0};
  rows.forEach(function(d){
    const a=auditFor(d)||d;
    const o=serviceOutcomeFor(a,pushByDelivery);
    if(o)outcomeCounts[o]++;
  });
  const serviceEngaged=outcomeCounts.booked+outcomeCounts.intro_follow+outcomeCounts.push;
  const servicePct=covered?Math.round((serviceEngaged/covered)*100):0;

  let personOptions='<option value="ALL">All Salespeople</option>';
  salespersonNames.forEach(function(n){personOptions+='<option value="'+esc(n)+'" '+(reportSalesperson===n?'selected':'')+'>'+esc(n)+'</option>';});
  let brandOptions='<option value="ALL">All Brands</option>';
  brands.forEach(function(n){brandOptions+='<option value="'+esc(n)+'" '+(reportBrand===n?'selected':'')+'>'+esc(n)+'</option>';});

  const monthSet=new Set();
  scopeRows.forEach(function(d){
    [d.estimated_delivery_at,d.scheduled_delivery_at,completionAt(d)].filter(Boolean).forEach(function(v){monthSet.add(monthKey(v));});
  });
  const availableMonths=Array.from(monthSet).filter(Boolean).sort().reverse();
  if(!availableMonths.includes(reportMonth))availableMonths.unshift(reportMonth);
  let monthOptions="";
  availableMonths.forEach(function(k){monthOptions+='<option value="'+esc(k)+'" '+(reportMonth===k?'selected':'')+'>'+esc(monthLabel(k))+'</option>';});

  function reportUrgency(d){
    const done=d.status==="completed"||!!completionAt(d);
    if(done)return 4;
    if(operationalDate(d)&&isPast(operationalDate(d)))return 0;
    if(d.estimated_delivery_at&&!d.scheduled_delivery_at&&monthKey(d.estimated_delivery_at)===reportMonth)return 1;
    if(d.scheduled_delivery_at)return 2;
    return 3;
  }
  let body="";
  rows.slice().sort(function(a,b){
    const ua=reportUrgency(a),ub=reportUrgency(b);if(ua!==ub)return ua-ub;
    return stableDeliverySort(a,b);
  }).forEach(function(d){
    const a=auditFor(d)||{};
    const outcome=serviceOutcomeFor(a,pushByDelivery);
    const outcomeText=outcome==="booked"?"Service Booked":outcome==="intro_follow"?"In-Person Intro / Booking to Follow":outcome==="push"?"Push to Service":"—";
    const vehicle=((d.vehicle_make||"")+" "+(d.vehicle_model||"")).trim()||d.brand||"—";
    const ds=displayStatus(d);
    const startAt=firstStepAt(d);
    const doneAt=completionAt(d);
    const pmins=processMinutes(d);
    const s3=step3Timing(d);

    body+='<tr>'+
      '<td>'+esc(d.estimated_delivery_at?fmtDateTime(d.estimated_delivery_at):"—")+'</td>'+
      '<td>'+esc(d.scheduled_delivery_at?fmtDateTime(d.scheduled_delivery_at):"Not booked")+'</td>'+
      '<td>'+esc(doneAt?fmtDateTime(doneAt):"—")+'</td>'+
      '<td>'+esc(d.customer_first_name)+' '+esc(d.customer_last_name)+'</td>'+
      '<td>'+esc(vehicle)+'</td>'+
      '<td>'+esc(d.rego||"—")+'</td>'+
      '<td>'+esc(d.stock_number||"—")+'</td>'+
      '<td>'+esc(d.assigned_salesperson_name||"")+'</td>'+
      '<td><span class="status '+esc(ds.key)+'">'+esc(ds.label)+'</span></td>'+
      '<td>'+esc(a.completed_steps||0)+'/4</td>'+
      '<td>'+esc(outcomeText)+'</td>'+
      '<td>'+esc(a.service_advisor||(pushByDelivery.get(d.id)&&pushByDelivery.get(d.id).actioned_by_name)||"—")+'</td>'+
      '<td>'+esc(startAt?fmtDateTime(startAt):"—")+'</td>'+
      '<td>'+esc(doneAt?fmtDateTime(doneAt):"—")+'</td>'+
      '<td>'+esc(durationText(pmins))+'</td>'+
      '<td>'+esc(s3.start?fmtDateTime(s3.start):"—")+'</td>'+
      '<td>'+esc(s3.end?fmtDateTime(s3.end):"—")+'</td>'+
      '<td>'+esc(durationText(s3.minutes))+'</td>'+
    '</tr>';
  });

  const chartMonths=lastMonthKeys(reportMonth,6);
  let chartHtml="";
  chartMonths.forEach(function(k){
    const mr=uniqueDeals(scopeRows.filter(function(r){return reportMonthMatch(r,k);}));
    const n=mr.length||0;
    const bookedN=mr.filter(isBooked).length;
    const c={booked:0,intro_follow:0,push:0};
    mr.forEach(function(d){const o=serviceOutcomeFor(auditFor(d)||d,pushByDelivery);if(o)c[o]++;});
    const bp=n?(bookedN/n*100):0;
    const sbp=n?(c.booked/n*100):0;
    const ip=n?(c.intro_follow/n*100):0;
    const pp=n?(c.push/n*100):0;
    chartHtml+='<div style="display:grid;gap:5px"><div class="chart-row"><div class="chart-month">'+esc(monthLabel(k).replace(/ \d{4}$/,""))+'</div><div class="chart-track" title="Booking coverage '+Math.round(bp)+'%"><div class="chart-seg chart-booked" style="width:'+bp.toFixed(2)+'%"></div></div><div class="chart-total">'+bookedN+'/'+n+'</div></div><div class="chart-row"><div class="chart-month" style="font-size:10px;color:#8b91a0">Service</div><div class="chart-track"><div class="chart-seg chart-booked" style="width:'+sbp.toFixed(2)+'%"></div><div class="chart-seg chart-intro" style="width:'+ip.toFixed(2)+'%"></div><div class="chart-seg chart-push" style="width:'+pp.toFixed(2)+'%"></div></div><div class="chart-total">'+(c.booked+c.intro_follow+c.push)+'/'+n+'</div></div></div>';
  });

  main.innerHTML='<button class="btn" id="backReport">← Deliveries</button>'+
    '<div class="hero" style="margin-top:20px"><div><div class="eyebrow">'+(ownOnly?"My performance":"Management")+'</div><h1>Delivery Report</h1></div><div class="small">Monthly report includes Estimated, Booked or Completed activity</div></div>'+
    '<div class="report-filters">'+
      '<div class="field"><label>Month</label><select id="reportMonth">'+monthOptions+'</select></div>'+
      (!ownOnly?'<div class="field"><label>Salesperson</label><select id="reportSalesperson">'+personOptions+'</select></div>':'<div class="field"><label>Salesperson</label><input value="'+esc(profile.full_name)+'" disabled></div>')+
      '<div class="field"><label>Brand</label><select id="reportBrand">'+brandOptions+'</select></div>'+
    '</div>'+
    '<div class="tiles" style="margin-bottom:18px"><div class="tile"><div class="tile-title">Covered</div><div class="tile-count">'+covered+'</div><div class="tile-meta">Unique deals booked and/or completed in '+esc(monthLabel(reportMonth))+'</div></div><div class="tile"><div class="tile-title">Delivery Booked</div><div class="tile-count">'+booked+'</div><div class="tile-meta">'+bookingPct+'% of Covered</div></div><div class="tile"><div class="tile-title">Completed Deliveries</div><div class="tile-count">'+completed+'</div><div class="tile-meta">'+completedPct+'% of Covered</div></div><div class="tile"><div class="tile-title">Process Gap</div><div class="tile-count">'+processGap+'</div><div class="tile-meta">Past delivery date • process incomplete</div></div></div>'+
    '<div class="report-subtiles"><div class="report-subtile"><div class="eyebrow">Service outcome 1</div><strong>'+outcomeCounts.booked+'</strong><div class="small">Service Booked · '+(covered?Math.round(outcomeCounts.booked/covered*100):0)+'%</div></div><div class="report-subtile"><div class="eyebrow">Service outcome 2</div><strong>'+outcomeCounts.intro_follow+'</strong><div class="small">In-Person Intro / Booking to Follow · '+(covered?Math.round(outcomeCounts.intro_follow/covered*100):0)+'%</div></div><div class="report-subtile"><div class="eyebrow">Service outcome 3</div><strong>'+outcomeCounts.push+'</strong><div class="small">Push to Service · '+(covered?Math.round(outcomeCounts.push/covered*100):0)+'%</div></div></div>'+
    '<div class="panel" style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"><div><div class="eyebrow">6 month trend</div><h2 style="margin-top:5px">Coverage & Service Outcomes</h2></div><div class="small">Top bar = booked ÷ monthly cohort • lower bar = Service outcomes ÷ monthly cohort</div></div><div class="report-chart" style="margin-top:20px">'+chartHtml+'</div><div class="chart-legend"><span><i class="legend-dot chart-booked"></i>Booked / Service Booked</span><span><i class="legend-dot chart-intro"></i>In-Person Intro / Booking to Follow</span><span><i class="legend-dot chart-push"></i>Push to Service</span></div></div>'+
    '<div class="panel table-wrap"><h2 style="margin-bottom:12px">Delivery Activity</h2><table><thead><tr><th>Estimated</th><th>Booked</th><th>Delivered</th><th>Customer</th><th>Vehicle</th><th>Rego</th><th>Stock #</th><th>Salesperson</th><th>Status</th><th>Steps</th><th>Service Outcome</th><th>Service Advisor</th><th>First Step</th><th>Completed</th><th>Total Process</th><th>Step 3 Sent</th><th>Step 3 Done</th><th>Step 3 Time</th></tr></thead><tbody>'+(body||'<tr><td colspan="18">No delivery activity for this filter.</td></tr>')+'</tbody></table></div>';

  document.getElementById("backReport").addEventListener("click",function(){document.body.classList.remove("reports-wide");currentView="home";renderHome();});
  document.getElementById("reportMonth").addEventListener("change",function(e){reportMonth=e.target.value;renderReports(ownOnly);});
  const rs=document.getElementById("reportSalesperson");if(rs)rs.addEventListener("change",function(e){reportSalesperson=e.target.value;renderReports(ownOnly);});
  document.getElementById("reportBrand").addEventListener("change",function(e){reportBrand=e.target.value;renderReports(ownOnly);});
}

function startRealtime(){
  if(realtimeChannel)return;
  realtimeChannel=sb.channel("delivery-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"delivery_steps"},async function(payload){
      if(activeSession && payload.new && payload.new.session_id===activeSession.id){
        await refreshActive(true);
      }
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"service_handoffs"},async function(payload){
      if(activeSession && payload.new && payload.new.session_id===activeSession.id){const modal=document.getElementById("qrModal");if(modal)modal.remove();toast("Service has completed Step 3");await refreshActive(true);}
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"service_push_queue"},async function(payload){
      if(profile&&profile.role==="service"){await renderServiceLanding();return;}
      if(activeSession && payload.new && payload.new.session_id===activeSession.id){toast("Service queue updated");await refreshActive(true);return;}
      if(currentView==="reports"){await renderReports(reportOwnOnly);}
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"deliveries"},async function(){
      if(!activeDelivery){await loadDeliveries();await renderCurrentView();}
    })
    .subscribe();
  startSilentPolling();
  setInterval(loadWeather,45*60*1000);
}

function startSilentPolling(){
  if(silentPollTimer||!profile||profile.role==="service")return;
  silentPollTimer=setInterval(async function(){
    if(document.hidden)return;
    const activeId=activeDelivery&&activeDelivery.id;
    const scrollY=window.scrollY;
    await syncFromTim("",homeMode==="today"?null:"outstanding");
    await loadDeliveries();
    if(activeId){await refreshActive(true);}else if(document.getElementById("main")){await renderCurrentView();requestAnimationFrame(function(){window.scrollTo(0,scrollY);});}
  },45000);
}

document.addEventListener("visibilitychange",async function(){
  if(!document.hidden&&sb&&profile&&profile.role!=="service"){
    const scrollY=window.scrollY;await syncFromTim("",homeMode==="today"?null:"outstanding");await loadDeliveries();
    if(activeDelivery)await refreshActive(true);else if(document.getElementById("main")){await renderCurrentView();requestAnimationFrame(function(){window.scrollTo(0,scrollY);});}
  }
});

init().catch(function(err){
  console.error(err);
  fatal(err && err.message ? err.message : "Unexpected startup error.");
});

})();
</script>
</body>
</html>
